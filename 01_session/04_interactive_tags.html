<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: aqua;">
    <button type="button" onclick="alert('Hello world!')">Click Me!</button>
    <button type="button" onclick="alert('My name is Aryan Jain')">Click Me!</button>
    <ul>
        <li><data value="21053">HTML</data></li>
        <li><data value="21054">CSS</data></li>
        <li><data value="21055">JAVA SCRIPT</data></li>
    </ul>
    <h1>The menu element</h1>
    <menu>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </menu>
    <marquee behavior="" direction="">This is an example of html marquee</marquee>
    <marquee behavior="" direction="" bgcolor="pink">This is an example of a alternate marquee</marquee>
    <marquee width="100% " behavior="" direction="right">This is an example of a right direction marquee</marquee>
    <p>Display a gauge:</p>
    <meter value="30" min="1" max="100">30 out of 100</meter><br>
    <meter value="0.8">80%</meter>
    <select>
        <option value="">--select your favourite colour--</option>
        <option value="blue" style="color: blue;">Blue</option>
        <option value="white" style="color: violet;">Violet</option>
        <option value="black" style="color: red;">Red</option>
    </select>
</body>

</html>
